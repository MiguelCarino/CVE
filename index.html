const GROUP_ORDER = ['Yours', 'Triage', 'Edge & VPN', 'Operating systems', 'Servers & data',
    'Browsers', 'Clinical & imaging', 'Cloud & CI', 'Languages & runtimes'];
const DEFAULT_PINS = ['d:crit7', 'd:linux', 'd:windows', 'd:chrome', 'd:dicom'];

const SEV_LABEL = { LOW: 'Low+', MEDIUM: 'Medium+', HIGH: 'High+', CRITICAL: 'Critical only' };
const SORT_LABEL = {
    'date-old': 'Date (Oldest First)',
    'score-high': 'Score (High to Low)',
    'score-low': 'Score (Low to High)',
};

// localStorage is the one thing this page stores, and it holds only the views
// the user made. It throws outright in some privacy modes, so every access is
// guarded and a failure just means "no saved views".
let views = { pins: null, custom: [] };
function loadViews() {
    try {
        const j = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
        views = {
            pins: Array.isArray(j.pins) ? j.pins : null,
            custom: Array.isArray(j.custom) ? j.custom.filter((v) => v && v.id && v.label) : [],
        };
    } catch (e) { views = { pins: null, custom: [] }; }
}
function saveViews() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(views)); } catch (e) { /* private mode */ }
}

const allViews = () => views.custom.concat(DEFAULT_VIEWS);
const pinIds = () => (views.pins || DEFAULT_PINS);

function pinnedViews() {
    const byId = {};
    allViews().forEach((v) => { byId[v.id] = v; });
    return pinIds().map((id) => byId[id]).filter(Boolean).slice(0, MAX_PINS);
}

function timeframeLabel(tv) {
    if (/^\d{4}$/.test(tv)) return tf('Year %1', tv);
    return t_({ '7': 'Last 7 Days', '30': 'Last 30 Days', '90': 'Last 90 Days' }[tv] || 'Last 90 Days');
}

function viewSummary(v) {
    const bits = [];
    if (v.q) bits.push('“' + v.q + '”');
    bits.push(timeframeLabel(v.t || '90'));
    bits.push(v.s ? t_(SEV_LABEL[v.s]) : t_('Any severity'));
    if (v.k) bits.push(t_('KEV only'));
    if (v.e) bits.push(tf('EPSS ≥ %1', v.e));
    if (v.o && v.o !== 'date-new') bits.push(t_(SORT_LABEL[v.o]));
    return bits.join(' · ');
}

function applyView(v) {
    state.keyword = v.q || '';
    state.timeframe = v.t || '90';
    state.severity = v.s || '';
    state.sort = v.o || 'date-new';
    state.kev = !!v.k;
    const e = parseFloat(v.e);
    state.epssMin = isFinite(e) && e > 0 && e <= 1 ? e : 0;
    writeControls();
    runSearch();
}

/* ---- the rail's five chips ---- */

function renderChips() {
    const wrap = document.getElementById('quickChips');
    if (!wrap) return;
    wrap.innerHTML = '';
    pinnedViews().forEach((v) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tag';
        b.textContent = t_(v.label);
        b.title = viewSummary(v);
        b.addEventListener('click', () => applyView(v));
        wrap.appendChild(b);
    });
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'tag qv-more';
    more.textContent = '⋯';
    more.title = t_('All quick views');
    more.setAttribute('aria-label', t_('All quick views'));
    more.addEventListener('click', openViews);
    wrap.appendChild(more);
}

/* ---- the dialog ---- */

function openViews() {
    renderViewList();
    const d = document.getElementById('viewsDialog');
    d.showModal();
    document.getElementById('qvFilter').focus();
}

function renderViewList() {
    const list = document.getElementById('qvList');
    const needle = (document.getElementById('qvFilter').value || '').trim().toLowerCase();
    const pins = pinIds();
    const groups = {};
    allViews().forEach((v) => {
        const label = t_(v.label);
        if (needle && (label + ' ' + (v.q || '')).toLowerCase().indexOf(needle) === -1) return;
        const g = v.group === 'yours' ? 'Yours' : v.group;
        (groups[g] = groups[g] || []).push(v);
    });

    list.innerHTML = '';
    let any = false;
    GROUP_ORDER.forEach((g) => {
        if (!groups[g]) return;
        any = true;
        const h = document.createElement('div');
        h.className = 'qv-group';
        h.textContent = t_(g);
        list.appendChild(h);
        groups[g].forEach((v) => list.appendChild(viewRow(v, pins.indexOf(v.id) !== -1)));
    });
    if (!any) {
        const p = document.createElement('p');
        p.className = 'qv-none';
        p.textContent = t_('No views match.');
        list.appendChild(p);
    }
}

function viewRow(v, pinned) {
    const row = document.createElement('div');
    row.className = 'qv-item';

    const go = document.createElement('button');
    go.type = 'button';
    go.className = 'qv-go';
    go.innerHTML = esc(t_(v.label)) + '<small>' + esc(viewSummary(v)) + '</small>';
    go.addEventListener('click', () => {
        document.getElementById('viewsDialog').close();
        applyView(v);
    });
    row.appendChild(go);

    const pin = document.createElement('button');
    pin.type = 'button';
    pin.className = 'qv-act' + (pinned ? ' on' : '');
    pin.textContent = pinned ? '★' : '☆';
    pin.title = t_(pinned ? 'Unpin' : 'Pin');
    pin.setAttribute('aria-label', pin.title);
    pin.addEventListener('click', () => togglePin(v.id));
    row.appendChild(pin);

    if (v.group === 'yours') {
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'qv-act';
        del.textContent = '✕';
        del.title = t_('Delete');
        del.setAttribute('aria-label', del.title);
        del.addEventListener('click', () => {
            views.custom = views.custom.filter((c) => c.id !== v.id);
            if (views.pins) views.pins = views.pins.filter((id) => id !== v.id);
            saveViews(); renderChips(); renderViewList();
        });
        row.appendChild(del);
    }
    return row;
}

function togglePin(id) {
    const cur = pinIds().slice();
    const at = cur.indexOf(id);
    if (at !== -1) cur.splice(at, 1);
    else { cur.unshift(id); if (cur.length > MAX_PINS) cur.pop(); }
    views.pins = cur;
    saveViews(); renderChips(); renderViewList();
}

function saveCurrentView() {
    readControls();
    const nameEl = document.getElementById('qvName');
    const label = (nameEl.value || '').trim() || state.keyword || t_('Untitled view');
    const v = {
        id: 'u:' + Date.now().toString(36),
        group: 'yours', label: label,
        q: state.keyword, t: state.timeframe, s: state.severity, o: state.sort,
        // A view is the whole search state, and since §10 these two are part
        // of it — a saved "known exploited" view that forgot the KEV filter
        // would restore as a plain 90-day search and look like it worked.
        k: state.kev ? 1 : 0, e: state.epssMin,
    };
    views.custom.unshift(v);
    views.pins = [v.id].concat(pinIds().filter((id) => id !== v.id)).slice(0, MAX_PINS);
    saveViews();
    nameEl.value = '';
    renderChips();
    renderViewList();
}

function wireViews() {
    loadViews();
    renderChips();

    document.getElementById('qvSave').addEventListener('click', saveCurrentView);
    document.getElementById('qvName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveCurrentView(); }
    });
    document.getElementById('qvFilter').addEventListener('input', renderViewList);

    document.getElementById('qvExport').addEventListener('click', () => {
        download('cve-views.json', 'application/json', JSON.stringify(views, null, 2));
    });
    document.getElementById('qvImport').addEventListener('click', () => document.getElementById('qvFile').click());
    document.getElementById('qvFile').addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
            try {
                const j = JSON.parse(r.result);
                const incoming = (Array.isArray(j.custom) ? j.custom : []).filter((v) => v && v.id && v.label);
                const have = {};
                views.custom.forEach((v) => { have[v.id] = 1; });
                views.custom = views.custom.concat(incoming.filter((v) => !have[v.id]));
                if (Array.isArray(j.pins)) views.pins = j.pins.slice(0, MAX_PINS);
                saveViews(); renderChips(); renderViewList();
            } catch (err) { console.error(err); }
            e.target.value = '';
        };
        r.readAsText(f);
    });

    // Placeholders are attributes, so they sit outside applyStaticI18n's reach.
    qvPlaceholders();
}

function qvPlaceholders() {
    const name = document.getElementById('qvName');
    const filter = document.getElementById('qvFilter');
    if (name) name.placeholder = t_('Name this view');
    if (filter) filter.placeholder = t_('Filter views…');
}

/* ---- wiring ---------------------------------------------------------- */

function wire() {
    buildYearOptions();
    readHash();
    writeControls();

    document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        runSearch();
    });

    wireViews();

    document.getElementById('sortBy').addEventListener('change', reSortList);
    document.getElementById('kevOnly').addEventListener('change', reFilterList);
    document.getElementById('epssMin').addEventListener('change', reFilterList);
    // Off until a feed lands, with the reason in the tooltip.
    syncEnrichControls();
    document.getElementById('qvClose').addEventListener('click',
        () => document.getElementById('viewsDialog').close());

    document.getElementById('resultsList').addEventListener('click', (e) => {
        const toggle = e.target.closest('.desc-toggle');
        if (toggle) {
            const p = document.getElementById(toggle.getAttribute('aria-controls'));
            const open = p.classList.toggle('expanded');
            toggle.setAttribute('aria-expanded', String(open));
            toggle.textContent = t_(open ? 'Collapse description' : 'Expand description');
            return;
        }
        const copy = e.target.closest('.btn-copy');
        if (copy && navigator.clipboard) {
            navigator.clipboard.writeText(copy.dataset.id).then(() => {
                const was = copy.textContent;
                copy.textContent = t_('Copied');
                setTimeout(() => { copy.textContent = was; }, 1200);
            }).catch(() => {});
        }
    });

    document.getElementById('exportCsv').addEventListener('click', () => {
        const rows = exportRows();
        if (!rows.length) return;
        const cols = Object.keys(rows[0]);
        const csv = [cols.join(',')].concat(
            rows.map((r) => cols.map((k) => csvCell(r[k])).join(','))).join('\n');
        download('cve-' + stamp() + '.csv', 'text/csv;charset=utf-8', csv);
    });

    document.getElementById('exportJson').addEventListener('click', () => {
        const rows = exportRows();
        if (!rows.length) return;
        download('cve-' + stamp() + '.json', 'application/json', JSON.stringify({
            source: 'NVD CVE API 2.0',
            retrieved: (retrievedAt || new Date()).toISOString(),
            // Every filter that decided which rows are below, not only the ones
            // that were asked of the source: the KEV and EPSS floors are applied
            // after the fetch (§10), and an export whose stamp omits them cannot
            // be recomputed from it. `false`/`0` rather than omitted, so the
            // reader can tell "not filtered" from "an older export".
            query: {
                keyword: state.keyword,
                timeframe: state.timeframe,
                minimumSeverity: state.severity || 'any',
                kevOnly: !!(state.kev && enrichReady().kev),
                minimumEpss: enrichReady().epss ? state.epssMin : 0,
            },
            loaded: records.length,
            matched: streams.reduce((n, s) => n + (s.total || 0), 0),
            results: rows,
        }, null, 2));
    });

    if (window.CveDataUI) {
        try { CveDataUI.init(); } catch (e) { console.error(e); }
    }
    // Watchlists build their own dialog and are reached from the Data dialog,
    // so this is the whole of their wiring here: the sidebar gains nothing.
    if (window.CveWatch) {
        try { CveWatch.init(); } catch (e) { console.error(e); }
    }
    document.getElementById('provenance').addEventListener('click', () => {
        if (window.CveDataUI) CveDataUI.open();
    });
    // The dialog downloads, updates or deletes the corpus; when it does, the
    // plan for the next query changes, so re-read what the store now holds.
    window.addEventListener('cve:datachanged', () => {
        refreshCorpusMeta().then(() => {
            syncTried = true;
            runSearch();
            // The mirror may have changed with it, and the feeds hang off that
            // same manifest — so re-check them rather than keep badges from an
            // address the user has just stopped using.
            corpusManifest = null;
            return loadEnrichment();
        });
    });

    refreshCorpusMeta()
        .then(runSearch)
        // Both run after the first paint and neither can disturb it:
        // backgroundSync never rejects, and loadEnrichment only adds badges.
        .then(() => setTimeout(() => { backgroundSync().then(loadEnrichment); }, 1500));
}

// i18n.js registers its own DOMContentLoaded listener from a deferred script,
// which means it runs after this one. Yielding a tick lets the static strings
// translate before the first cards are built from them.
window.addEventListener('DOMContentLoaded', () => setTimeout(wire, 0));

// Re-render on a fleet language switch (called from i18n.js).
window.cveRerender = function () {
    buildYearOptions();
    document.getElementById('timeSelect').value = state.timeframe;
    qvPlaceholders();
    syncEnrichControls();          // the tooltips are translated too
    renderChips();
    if (document.getElementById('viewsDialog').open) renderViewList();
    if (records.length || streams.length) renderList();
};
</script>
<!-- The offline corpus. Deferred, so they attach their globals before wire()
     runs, and in dependency order: cve-sync uses CveDB, cve-enrich uses both,
     cve-data-ui uses both, and cve-watch is reached from cve-data-ui. -->
<script src="js/cve-db.js" defer></script>
<script src="js/cve-sync.js" defer></script>
<script src="js/cve-sources.js" defer></script>
<script src="js/cve-enrich.js" defer></script>
<script src="js/cve-data-ui.js" defer></script>
<script src="js/cve-watch.js" defer></script>
<script src="carino-navbar.js" data-app="CVE" data-repo="CVE" defer></script>
<script src="carino-lang.js" defer></script>
<script src="i18n.js" defer></script>
<script>
/* Mobile: turn the filter rail into a ☰ drawer opened from the shared navbar.
   CVE has no navbar action controls, so the drawer just holds the filters; it
   auto-closes when a quick-tag or Search is tapped so the results show through.
   The ☰ is injected into the injected navbar (carino-navbar.js), so this waits
   for that bar to mount. Same pattern as netplan/topo.carino.systems. */
(function () {
    'use strict';
    var MQ = window.matchMedia('(max-width: 900px)');
    var controls = document.querySelector('.controls');
    if (!controls) return;

    var scrim = document.createElement('div');
    scrim.id = 'cveScrim';
    document.body.appendChild(scrim);

    function open() { controls.classList.add('open'); scrim.classList.add('open'); }
    function close() { controls.classList.remove('open'); scrim.classList.remove('open'); }
    function toggle() { controls.classList.contains('open') ? close() : open(); }

    scrim.addEventListener('click', close);
    window.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    // Running a search from inside the drawer should reveal the results behind it.
    controls.addEventListener('click', function (e) {
        if (MQ.matches && e.target.closest('.tag, .search-btn')) close();
    });

    function addBtn() {
        var nav = document.getElementById('carinoNav');
        if (!nav) return false;
        if (document.getElementById('cveMenuBtn')) return true;
        var b = document.createElement('button');
        b.id = 'cveMenuBtn'; b.type = 'button';
        b.setAttribute('aria-label', 'Toggle filters');
        b.textContent = '☰';
        b.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
        var left = nav.querySelector('.cn-left');
        if (left) left.insertBefore(b, left.firstChild); else nav.insertBefore(b, nav.firstChild);
        return true;
    }
    if (!addBtn()) {
        var n = 0, iv = setInterval(function () { if (addBtn() || ++n > 40) clearInterval(iv); }, 50);
    }
    var onChange = function () { if (!MQ.matches) close(); };
    if (MQ.addEventListener) MQ.addEventListener('change', onChange);
    else if (MQ.addListener) MQ.addListener(onChange);
})();
</script>
