<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/webp" href="logo.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Observatory</title>
    <!-- The observatory is now the Observatory mode of index.html (one
         renderer, one hash check). This page only forwards old links. The
         script runs first and keeps the panel and ?mirror=; the refresh is
         the fallback with scripts off. -->
    <meta http-equiv="refresh" content="0;url=index.html#m=obs">
    <script>
    (function () {
        'use strict';
        // Old #anchors name a panel. A bare #backlog must not reach index.html
        // as it is, or the list would read it as a keyword search.
        var PANELS = { backlog: 'backlog', kev: 'kev', volume: 'volume', severity: 'severity',
            cwe: 'cwe', cna: 'cna', quality: 'cna', rhythm: 'rhythm' };
        var h = location.hash.replace(/^#/, '');
        var x = Object.prototype.hasOwnProperty.call(PANELS, h) ? '&x=' + PANELS[h] : '';
        location.replace('index.html' + location.search + '#m=obs' + x);
    })();
    </script>
</head>
<body style="background:#050505;color:#a3a3a3;font-family:'IBM Plex Mono',monospace;padding:24px">
    <noscript>
        <p>The observatory has moved: <a href="index.html#m=obs" style="color:#eab308">open the Observatory in CVE Radar →</a></p>
    </noscript>
</body>
</html>
